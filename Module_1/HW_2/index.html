<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ночь в музее</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 id="event-title"></h1>

  <p id="event-date"></p>
  <p id="event-place"></p>
  <p id="event-description"></p>

  <button id="show-program">Показать программу</button>
  <div id="program" class="card" hidden></div>

  <form id="service-form" hidden>
    <label><input type="checkbox" id="guide"> Экскурсия с гидом</label>
    <label><input type="checkbox" id="audio"> Аудиогид</label>
    <label><input type="checkbox" id="catalog"> Каталог выставки</label>
    <button type="submit">Сформировать</button>
  </form>

  <div id="choice-error" class="error" hidden></div>
  <div id="data-error" class="error" hidden></div>

  <div id="result" class="card" hidden></div>
  <pre id="report-json" hidden></pre>

  <script src="app.js"></script>
</body>
</html>
